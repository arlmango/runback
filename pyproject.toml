[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runback-local"
version = "0.2.0"
description = "Explicit, verified small experiment snapshots for notebook users"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
runback = "runback.__main__:main"

[tool.setuptools]
packages = ["runback"]
